name: Fuzzing Tests

on:
  # Run daily
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: 'Fuzzing time per target (seconds)'
        required: false
        default: '300'
      runs:
        description: 'Number of runs per target'
        required: false
        default: '1000000'

  # Run on PRs to main/indev
  pull_request:
    branches:
      - main
      - indev
    paths:
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        target:
          - alert_registry_priority
          - alert_registry_errors
          - circuit_breaker_state
          - detection_engine_anomaly
          - cross_contract_errors
          - rbac_fuzzer
          - arithmetic_fuzzer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Run fuzzer
        run: |
          FUZZ_TIME=${{ github.event.inputs.fuzz_time || '60' }}
          RUNS=${{ github.event.inputs.runs || '100000' }}

          echo "Running ${{ matrix.target }} for ${FUZZ_TIME}s or ${RUNS} runs"

          cargo fuzz run ${{ matrix.target }} \
            -- \
            -max_total_time=${FUZZ_TIME} \
            -runs=${RUNS} \
            -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Fuzzer ${{ matrix.target }} found a crash!"
          echo "Check artifacts for crash inputs"

          if [ -d "fuzz/artifacts/${{ matrix.target }}" ]; then
            echo "Crash files:"
            ls -lh fuzz/artifacts/${{ matrix.target }}/
          fi

  summary:
    name: Fuzzing Summary
    runs-on: ubuntu-latest
    needs: fuzz
    if: always()

    steps:
      - name: Check fuzzing results
        run: |
          if [ "${{ needs.fuzz.result }}" == "failure" ]; then
            echo "::error::One or more fuzzers found crashes"
            exit 1
          elif [ "${{ needs.fuzz.result }}" == "success" ]; then
            echo "::notice::All fuzzers completed successfully"
          else
            echo "::warning::Fuzzing job status: ${{ needs.fuzz.result }}"
          fi
