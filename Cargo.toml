[package]
name = "arbishield"
version = "0.1.0"
edition = "2021"
resolver = "2"
license = "MIT OR Apache-2.0"
authors = ["ArbiShield Team"]
rust-version = "1.82"

[dependencies]
home = "=0.5.9"
stylus-sdk = "0.9.0"
alloy-primitives = "0.8.20"
alloy-sol-types = "0.8.20"
hex = { version = "0.4", default-features = false }
ruint = "=1.12.3"

[dev-dependencies]
tokio = { version = "1.12", features = ["full"] }
ethers = "2.0"
eyre = "0.6"
dotenv = "0.15"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = []

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "arbishield"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
panic = "abort"

[profile.dev]
# Note: using "unwind" to allow proptest to catch panics in tests
panic = "unwind"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = "warn"
correctness = "deny"
pedantic = "warn"

[[bench]]
name = "gas_benchmarks"
harness = false
